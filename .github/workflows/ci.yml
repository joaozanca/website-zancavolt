# Esteira de CI: roda em todo Pull Request para a main e a cada merge na main.
# Os nomes dos jobs são os status checks exigidos no ruleset da main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Um novo push no mesmo PR cancela a execução anterior, que ficou desatualizada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Versões das actions fixadas pelo hash do commit (o Dependabot atualiza); o comentário mostra a versão.
permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, tipos, formatação e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Não deixa o token do GitHub salvo no disco depois do checkout.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        # --ignore-scripts: pacotes não executam scripts próprios na instalação (proteção da cadeia de dependências).
        run: npm ci --ignore-scripts

      - name: Lint (ESLint)
        run: npm run lint

      - name: Checagem de tipos (TypeScript)
        run: npm run typecheck

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Vulnerabilidades nas dependências do site
        # Só as dependências que vão para o site publicado; as de desenvolvimento ficam com o Dependabot.
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Guardar o site gerado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out/
          retention-days: 7

  segredos:
    name: Segredos no código (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo, para analisar todos os commits do PR.
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem comentário no PR: o job só tem permissão de leitura (menor privilégio).
          # O vazamento aparece no check vermelho e no resumo do job.
          GITLEAKS_ENABLE_COMMENTS: false

  links:
    name: Links quebrados
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Confere links internos, imagens, âncoras (#secao) e links externos do site gerado.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/out
            --include-fragments
            'out/**/*.html'
          fail: true

  e2e:
    name: Testes E2E (Playwright)
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Não deixa o token do GitHub salvo no disco depois do checkout.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        # --ignore-scripts: pacotes não executam scripts próprios na instalação (proteção da cadeia de dependências).
        run: npm ci --ignore-scripts

      - name: Recuperar o site gerado
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out

      - name: Instalar o navegador do Playwright
        run: npm run test:e2e:install

      - name: Rodar os testes
        # Enquanto o QA não tiver escrito testes, o job passa sem nenhum teste.
        run: npm run test:e2e -- --pass-with-no-tests

      - name: Guardar o relatório dos testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 14
