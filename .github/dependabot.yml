# Atualizações automáticas de dependências: o Dependabot abre PRs que passam pela CI e pelo QA.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # Os tipos do Node acompanham o Node do projeto (.nvmrc = 24). Subir junto com o Node.
      - dependency-name: '@types/node'
        versions: ['>=25']
      # Versões grandes adiadas na triagem da ZV-13: o TypeScript 7 quebra o build e o ESLint 10
      # ainda não é suportado pelos plugins do eslint-config-next. Reavaliar em card próprio.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
    groups:
      # Agrupa as atualizações pequenas para não abrir um PR por pacote.
      dev-menores:
        dependency-type: development
        update-types: [minor, patch]
      producao-menores:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci(deps)
